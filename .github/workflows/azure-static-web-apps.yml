# Deploys the alliwan/ folder (the Al Liwan group's look of the three pages) to Azure Static Web Apps on every push to main.
# The repo root is what GitHub Pages serves; Azure serves only alliwan/ (its staticwebapp.config.json is in that folder).
# One-time setup: create the Static Web App (Free plan) in the Azure portal, copy its deployment token
# into the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN, and commit this file to .github/workflows/.
name: Deploy GCS to Azure Static Web Apps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/alliwan"
          output_location: ""
          skip_app_build: true
