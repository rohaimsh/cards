<!DOCTYPE html>
<html lang="en" dir="ltr" data-variant="alliwan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; font-src data:; script-src 'unsafe-inline'; connect-src https:; base-uri 'none'; form-action 'none'">
<title>Digital card</title>
<style>
:root{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  font-size:16px;line-height:1.5;
}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit}
.page{max-width:460px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}

.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 2px 14px;min-height:44px}
.co{font-size:14px;color:var(--ink-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:30px;max-width:120px;object-fit:contain;flex:none}
.pill{font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.pill.demo{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lang{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.bar-end{display:flex;gap:8px;align-items:center}

/* the card */
.card{background:var(--card);color:var(--card-ink);border-radius:22px;padding:22px 22px 24px}
.avatar{width:76px;height:92px;display:block}
.avatar text{font-family:inherit;font-weight:600;font-size:28px;fill:var(--accent-ink)}
.name{font-size:32px;font-weight:650;line-height:1.1;letter-spacing:-.01em;margin:18px 0 6px}
.alt{font-size:20px;color:var(--card-muted);margin-bottom:10px}
.role{font-size:17px;line-height:1.35}
.org{font-size:15px;color:var(--card-muted);margin-top:2px}

.btn{
  font:inherit;font-weight:600;font-size:16px;line-height:1.3;border:0;border-radius:12px;min-height:50px;padding:12px 18px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-quiet{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.6;cursor:default}
.card .btn{margin-top:22px}
.linkish{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* quick actions */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:500;min-height:64px;
}
.tile svg,.ico svg{width:22px;height:22px;display:block}

/* details */
.rows{margin-top:14px;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;padding:13px 2px;text-decoration:none;min-height:56px}
.ico{flex:none;width:28px;display:grid;place-items:center;color:var(--ink-2)}
.rl{min-width:0;display:flex;flex-direction:column}
.lab{font-size:13px;color:var(--ink-2)}
.val{font-size:16px;overflow-wrap:anywhere}

/* share form */
.share{margin-top:30px}
.share h2{font-size:21px;font-weight:600;line-height:1.25}
.sub{color:var(--ink-2);font-size:15px;margin:4px 0 16px;max-width:38ch}
.field{margin-bottom:14px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
label small{color:var(--ink-2);font-weight:400}
input,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;min-height:48px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);
}
textarea{min-height:88px;resize:vertical}
.field.bad input,.field.bad textarea{border-color:var(--err)}
.err{color:var(--err);font-size:14px;margin-top:6px}
.consent{display:flex;gap:12px;align-items:flex-start;margin:6px 0 18px;font-size:14px;color:var(--ink-2);font-weight:400}
.consent input{width:22px;height:22px;min-height:22px;margin:1px 0 0;flex:none;accent-color:var(--icon,var(--card))}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.how{margin-top:14px;font-size:13px;color:var(--ink-2)}
.how summary{cursor:pointer}
.how p{margin-top:6px}
.thanks{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:20px}
.thanks-head{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:600}
.thanks-head svg{width:24px;height:24px;color:var(--ok);flex:none}
.thanks p{margin:6px 0 16px;color:var(--ink-2)}

.trust{margin-top:26px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.trust svg{width:16px;height:16px;flex:none}
.trust.ok{color:var(--ok)}
.foot{margin-top:18px;font-size:12px;color:var(--ink-2);text-align:center}

/* states */
.skel{min-height:300px}
.skel i{display:block;height:16px;border-radius:8px;background:var(--card-2);margin-top:14px;animation:pulse 1.4s ease-in-out infinite}
.skel i:nth-child(1){width:76px;height:92px;border-radius:38px 38px 0 0;margin-top:0}
.skel i:nth-child(2){width:64%;height:30px;margin-top:22px}
.skel i:nth-child(3){width:40%}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.missing{text-align:start;padding:8px 2px}
.missing h1{font-size:24px;font-weight:600;margin-bottom:6px}
.missing p{color:var(--ink-2)}

.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:5;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/*@skin-begin*/
/* GCS skin: one design for the three pages (staff app, card page, admin console), two looks. Selected by <html data-variant="alliwan|dev">.
   Source of truth: tools/skin/skin.css. tools/sync_skin.py copies it into the three pages (between the skin markers); tools/make_variants.py then builds the two deployable sets.
   alliwan  "ALL Black", the Al Liwan Labs design language, made for a phone and not copied one to one (where it comes from: docs/DESIGN-VARIANTS.md):
            16px text (the language is 13px), 44px touch targets, hairline borders, no gradients,
            one 1px shadow on the primary button, motion at most 180ms, status in words as well as colour, Inter, dark first and light when the phone asks.
   dev      the owner's Great Teacher Onizuka look: zine paper (or night garage), thick black outlines, hard shadows, acid yellow, heavy type, stickers.
   The pages' own CSS holds layout and sizes and reads only these tokens; a look is a set of token values plus a few decorations at the end. */

/* ===== tokens: alliwan, dark (the default, and what a page without data-variant gets) ===== */

  color-scheme:dark;
  --font:"Inter Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;

  --ink:#eeeef0; --ink-2:#97989d; --faint:#9a9b9f;
  --card:#202123; --card-2:#2a2b2e; --card-ink:#eeeef0; --card-muted:#97989d; --card-line:#2b2c2f;
  --accent:#aecbfa; --accent-hover:#c4d9fb; --accent-ink:#101112;

  --btn2-bg:#252629; --btn2-ink:#eeeef0; --btn2-line:#37383b; --btn2-hover:#2d2e32;
  --ok:#a6c7b2; --err:#e7a99d; --warn:#d8b883; --focus:#aecbfa;
  --tab-active:#eeeef0; --tab-bg:#141516; --tab-line:#2a2b2e; --tab-on:#2a2b2e; --tab-ink:#97989d; --tab-ink-on:#eeeef0;

  --toast-bg:#1c1d1f; --toast-ink:#f7f6f2; --toast-line:#1c1d1f;
  --overlay:rgba(28,29,31,.4); --stamp:#2f5d9e; --icon-ink:#2f5d9e; --qr-ink:#1c1d1f;
}

/* ===== tokens: dev, light ("zine paper") ===== */
:root[data-variant="dev"]{
  color-scheme:light;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --font-display:"Arial Black","Helvetica Neue",Impact,"Segoe UI Black","Roboto Black",system-ui,sans-serif;
  --font-label:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --bg:#efe7cf; --surface:#fffbe8; --surface-2:#fffbe8; --line:#0b0b0b; --line-2:#0b0b0b;
  --ink:#0b0b0b; --ink-2:#4b4636; --faint:#4b4636;
  --card:#0b0b0b; --card-2:#2a2a2a; --card-ink:#fff6cf; --card-muted:#d6cfb0; --card-line:#0b0b0b;
  --accent:#ffd400; --accent-hover:#ffe34d; --accent-ink:#0b0b0b;
  --btn-bg:#ffd400; --btn-ink:#0b0b0b; --btn-hover:#ffe34d; --btn-line:#0b0b0b;
  --btn2-bg:#fffbe8; --btn2-ink:#0b0b0b; --btn2-line:#0b0b0b; --btn2-hover:#fff0a8;
  --ok:#0b6b36; --err:#c4130b; --warn:#8a5a00; --focus:#0050ff;
  --tab-active:#0b0b0b; --tab-bg:#0b0b0b; --tab-line:#0b0b0b; --tab-on:#ffd400; --tab-ink:#e9e2c4; --tab-ink-on:#0b0b0b;
  --field-bg:#fffdf3; --field-line:#0b0b0b; --guess-bg:#fff1a6;
  --toast-bg:#ffd400; --toast-ink:#0b0b0b; --toast-line:#0b0b0b;
  --overlay:rgba(11,11,11,.6); --stamp:#e5251b; --icon-ink:#0b0b0b; --hl:#ffd400; --shadow-col:#0b0b0b; --dots:radial-gradient(rgba(11,11,11,.11) 1.1px,transparent 1.4px);
  --qr-ink:#0b0b0b;
  --radius:6px; --radius-card:10px; --radius-pill:3px; --radius-tab:4px;
  --bw:3px; --bw-field:2px;
  --shadow-btn:4px 4px 0 var(--shadow-col); --shadow-btn2:3px 3px 0 var(--shadow-col); --shadow-card:6px 6px 0 var(--shadow-col); --shadow-sm:3px 3px 0 var(--shadow-col); --shadow-sheet:0 -4px 0 var(--shadow-col);
  --display-case:uppercase; --display-weight:900; --display-track:-.01em;
  --btn-weight:900; --btn-track:.04em; --btn-case:uppercase;
  --name-size:34px; --name-weight:900; --name-track:-.02em; --name-case:uppercase; --name-skew:-6deg;
  --h2-size:20px; --h2-weight:900; --label-case:uppercase; --label-track:.05em;
  --press:translate(3px,3px); --ease:90ms ease-out; --sheet-time:.22s;
}
/* ===== dev, dark ("night garage") ===== */
@media (prefers-color-scheme:dark){
  :root[data-variant="dev"]:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0c0c; --surface:#171717; --surface-2:#171717; --line:#f4ecd0; --line-2:#f4ecd0;
    --ink:#f7f1da; --ink-2:#bdb599; --faint:#bdb599;
    --card:#1c1c1c; --card-2:#333333; --card-ink:#fff6cf; --card-muted:#cfc7a8; --card-line:#f4ecd0;
    --btn2-bg:#171717; --btn2-ink:#f7f1da; --btn2-line:#f4ecd0; --btn2-hover:#262626;
    --ok:#5fe0a0; --err:#ff7a6e; --warn:#ffb347; --focus:#7db3ff;
    --tab-bg:#0c0c0c; --tab-line:#f4ecd0; --tab-active:#ffd400;
    --field-bg:#0f0f0f; --field-line:#f4ecd0; --guess-bg:#3a3300;
    --toast-line:#0b0b0b; --overlay:rgba(0,0,0,.7); --hl:#c4130b; --icon-ink:#ffd400; --shadow-col:#f4ecd0; --dots:radial-gradient(rgba(244,236,208,.07) 1.1px,transparent 1.4px);
    --qr-ink:#0b0b0b;
  }
}
:root[data-variant="dev"][data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c0c; --surface:#171717; --surface-2:#171717; --line:#f4ecd0; --line-2:#f4ecd0;
  --ink:#f7f1da; --ink-2:#bdb599; --faint:#bdb599;
  --card:#1c1c1c; --card-2:#333333; --card-ink:#fff6cf; --card-muted:#cfc7a8; --card-line:#f4ecd0;
  --btn2-bg:#171717; --btn2-ink:#f7f1da; --btn2-line:#f4ecd0; --btn2-hover:#262626;
  --ok:#5fe0a0; --err:#ff7a6e; --warn:#ffb347; --focus:#7db3ff;
  --tab-bg:#0c0c0c; --tab-line:#f4ecd0; --tab-active:#ffd400;
  --field-bg:#0f0f0f; --field-line:#f4ecd0; --guess-bg:#3a3300;
  --toast-line:#0b0b0b; --overlay:rgba(0,0,0,.7); --hl:#c4130b; --icon-ink:#ffd400; --shadow-col:#f4ecd0; --dots:radial-gradient(rgba(244,236,208,.07) 1.1px,transparent 1.4px);
  --qr-ink:#0b0b0b;
}

/* Arabic: the system's own Arabic face, never the monospace or the heavy Latin display faces (they break the joined letters) */
:root[dir="rtl"]{--font-label:var(--font);--font-display:var(--font)}

/* ===== shared parts, driven by the tokens ===== */
/* border-box set directly, not inherited: what sits inside <details> inherits from a box the browser makes (content-box), which pushed full-width rows past the edge */
*,*::before,*::after{box-sizing:border-box}
body{font-family:var(--font);background-color:var(--bg);background-image:var(--dots);background-size:9px 9px;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--font-display)}
h2{font-size:var(--h2-size);font-weight:var(--h2-weight);text-transform:var(--display-case);letter-spacing:var(--display-track)}

/* the card (hero) and its monogram */
.card{background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--card-line);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.name{font-family:var(--font-display);font-size:var(--name-size);font-weight:var(--name-weight);letter-spacing:var(--name-track);text-transform:var(--name-case);transform:skewX(var(--name-skew));transform-origin:left bottom}
[dir=rtl] .name{transform-origin:right bottom}
.avatar path,.mini path,.lock-mark path{stroke:var(--card-line);stroke-width:0}
.avatar text,.mini text{fill:var(--accent-ink)}

/* buttons */
.btn{
  font-family:var(--font-display);font-weight:var(--btn-weight);letter-spacing:var(--btn-track);text-transform:var(--btn-case);
  background:var(--btn2-bg);color:var(--btn2-ink);border:var(--bw) solid var(--btn2-line);border-radius:var(--radius);box-shadow:var(--shadow-btn2);
  transition:background var(--ease),border-color var(--ease),transform 80ms ease-out,box-shadow 80ms ease-out;
}
.btn:hover{background:var(--btn2-hover)}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-line);box-shadow:var(--shadow-btn)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-secondary,.btn-quiet{background:var(--btn2-bg);color:var(--btn2-ink);border-color:var(--btn2-line)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:active:not(:disabled){transform:var(--press);box-shadow:none}
.link-btn,.linkish{color:var(--ink);text-decoration-color:var(--ink-2)}
.chip-btn,.lang,.ver,.pill,.badge{
  font-family:var(--font-label);border:var(--bw-field) solid var(--line-2);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink-2);
}
.chip-btn,.lang{color:var(--ink);transition:background var(--ease),border-color var(--ease)}
.lang{font-family:var(--font)}   /* its label is Arabic on the English page: never the monospace face */
.chip-btn:hover,.lang:hover{border-color:var(--ink-2)}
.pill,.badge,.ver{text-transform:var(--label-case);letter-spacing:var(--label-track)}
.badge.ok,.pill.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn,.pill.bad{color:var(--err);border-color:var(--err)}
.pill.demo{background:var(--stamp);border-color:var(--line);color:var(--accent-ink)}
.chip-btn.rec{background:var(--err);color:var(--bg);border-color:var(--err)}

/* fields */
input,textarea{background:var(--field-bg);color:var(--ink);border:var(--bw-field) solid var(--field-line);border-radius:var(--radius);transition:border-color var(--ease),background var(--ease)}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.8}
input:focus,textarea:focus{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:0}
input.guess{border-color:var(--accent);background:var(--guess-bg)}
label{text-transform:var(--label-case);letter-spacing:var(--label-track)}
label small{text-transform:none;letter-spacing:0}
label.consent,.how,.trust{text-transform:none;letter-spacing:normal;font-family:var(--font)}   /* the consent sentence and the privacy text are read, not decoration: never capitals or spaced out */
.error,.err{color:var(--err)}
.field.invalid input,.field.bad input,.field.bad textarea{border-color:var(--err)}

/* panels, rows and boxes */
.crow,.tile,.qr-block,.leads,.dup-box,.install-hint,.editing,.empty,.box,.kpi,.notice,.shell .rows li,.thanks,.menu{
  border-width:var(--bw);border-color:var(--line);box-shadow:var(--shadow-sm);
}
.qr-block,.empty{border-radius:var(--radius-card)}
.tile{font-family:var(--font-label);text-transform:var(--label-case);letter-spacing:var(--label-track)}
.tile svg{color:var(--icon,var(--icon-ink))}
.crow:hover,.tile:hover{border-color:var(--ink-2)}
.crow:active,.tile:active{transform:var(--press);box-shadow:none}
.seg{border:var(--bw-field) solid var(--line-2);background:var(--bg)}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.seg button{font-family:var(--font-label);text-transform:var(--label-case);letter-spacing:var(--label-track)}
.grp,.eyebrow,.lab{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.grp{font-size:11px;font-weight:600}
.cname,.val{font-family:var(--font)}
.csub.ok,.delta.up{color:var(--ok)} .csub.warn,.delta.down{color:var(--err)}
.count,.cwhen{font-family:var(--font-label)}

/* the "more" menu: rows like a settings list, one tap each */
details.opt.more{margin-top:16px;border-top:0;padding-top:0}
details.opt.more>summary{min-height:48px;padding:10px 2px;font-family:var(--font-label);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600;color:var(--ink-2)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:6px}
.mrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:12px 14px;margin:0;
  background:none;border:0;border-top:1px solid var(--line);border-radius:0;color:var(--ink);font:inherit;font-size:15px;text-align:start;cursor:pointer;
  transition:background var(--ease);
}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--btn2-hover)}
.mrow::after{content:"";flex:none;width:7px;height:7px;border-top:2px solid var(--ink-2);border-right:2px solid var(--ink-2);transform:rotate(45deg);margin-inline-end:3px}
[dir=rtl] .mrow::after{transform:rotate(-135deg)}
.mrow.danger{color:var(--err)}
.mrow.static{cursor:default;flex-wrap:wrap}
.mrow.static::after{display:none}
.mrow.static:hover{background:none}
.mrow .seg{margin:0}
.mrow.static .seg{display:flex;width:100%;margin-top:2px}
.mrow.static .seg button{flex:1 1 0;white-space:nowrap}

/* tab bar, sheet, toast, scanner */
.tabbar{background:var(--tab-bg);border-top:var(--bw) solid var(--tab-line)}
.tab{color:var(--tab-ink);font-family:var(--font-label);border-radius:var(--radius-tab);transition:background var(--ease),color var(--ease)}
.tab.active{color:var(--tab-ink-on);background:var(--tab-on)}
.backdrop{background:var(--overlay);transition:opacity var(--sheet-time)}
.sheet{background:var(--surface);color:var(--ink);border-top:var(--bw) solid var(--line);border-radius:var(--radius-card) var(--radius-card) 0 0;box-shadow:var(--shadow-sheet);transition:transform var(--sheet-time) cubic-bezier(.2,.8,.2,1),visibility 0s var(--sheet-time)}
.sheet.open{transition:transform var(--sheet-time) cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-head h3{font-family:var(--font-display);text-transform:var(--display-case);letter-spacing:var(--display-track);font-weight:var(--display-weight)}
.close{background:var(--bg);color:var(--ink);border:var(--bw-field) solid var(--line-2)}
.toast{background:var(--toast-bg);color:var(--toast-ink);border:var(--bw-field) solid var(--toast-line);border-radius:var(--radius);font-family:var(--font)}
.scanner{background:#000}
.finder{border-color:var(--accent);box-shadow:0 0 0 2000px rgba(0,0,0,.5)}
.scan-hint{color:#fff}
.slot{background:var(--surface);border:2px dashed var(--line-2)}
.slot.filled .slot-name,.slot.filled .slot-add{background:rgba(0,0,0,.66);color:#fff}
.qr{background:#fff}

/* admin console parts that the other pages do not have */
.nav a[aria-current="page"]{color:var(--tab-active);border-bottom-color:var(--accent)}
.nav a{font-family:var(--font)}
.kpi b{font-family:var(--font-display);font-weight:var(--display-weight)}
.bars rect,.hb-bar i{fill:var(--accent);background:var(--accent)}
.hb-bar{background:var(--bg)}
.warn,.problem{border-color:var(--err)}
.notice.warn{border-color:var(--accent)}

/* ===== dev only: stickers, stripes, the Oni watermark ===== */
:root[data-variant="dev"] body{background-attachment:fixed}
:root[data-variant="dev"] .card{position:relative;overflow:hidden}
:root[data-variant="dev"] .card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:14px;
  background:repeating-linear-gradient(-45deg,#ffd400 0 12px,#0b0b0b 12px 24px);border-bottom:var(--bw) solid var(--card-line);
}
:root[data-variant="dev"] .card::after{
  content:"\9B3C";position:absolute;inset-inline-end:-8px;bottom:-30px;font:900 150px/1 var(--font-display);color:rgba(255,212,0,.1);pointer-events:none;
}
:root[data-variant="dev"] .card>*{position:relative;z-index:1}
:root[data-variant="dev"] .card{padding-top:36px}
:root[data-variant="dev"] .avatar{transform:rotate(-4deg);filter:drop-shadow(3px 3px 0 #000)}
:root[data-variant="dev"] .avatar path{stroke:#0b0b0b;stroke-width:3}
:root[data-variant="dev"] .mini path{stroke:#0b0b0b;stroke-width:3}
:root[data-variant="dev"] h2{text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:.34em;text-underline-offset:-.14em;text-decoration-skip-ink:none}
:root[data-variant="dev"] .pill.demo,:root[data-variant="dev"] .badge.ok{transform:rotate(-3deg)}
:root[data-variant="dev"] .pill.demo{color:#fff;border-color:#0b0b0b;box-shadow:2px 2px 0 var(--shadow-col)}
:root[data-variant="dev"] .toast{transform:translateX(-50%) rotate(-1.5deg);box-shadow:4px 4px 0 var(--shadow-col)}
:root[data-variant="dev"] .tab.active{box-shadow:inset 0 -4px 0 #0b0b0b}
:root[data-variant="dev"] .tabbar{box-shadow:0 -4px 0 #ffd400}
:root[data-variant="dev"] .wordmark{font-family:var(--font-display);font-style:italic;font-weight:900;letter-spacing:-.02em;font-size:22px;text-transform:uppercase}
:root[data-variant="dev"] .wm-sub{display:inline-block;margin-inline-start:8px;padding:2px 6px;background:var(--stamp);color:#fff;font:700 10px/1.3 var(--font-label);letter-spacing:.08em;text-transform:uppercase;transform:rotate(-2deg);vertical-align:3px}
:root[data-variant="dev"] .lock{position:relative}
:root[data-variant="dev"] .lock::before{content:"\9B3C";position:absolute;inset:auto 0 12% 0;margin:auto;font:900 220px/1 var(--font-display);color:rgba(255,212,0,.12);pointer-events:none;text-align:center}
:root[data-variant="dev"] .lock>*{position:relative}
:root[data-variant="dev"] .seg button.on{box-shadow:none}
:root[data-variant="dev"] .qr{border:var(--bw) solid #0b0b0b}
:root[dir="rtl"] *{letter-spacing:normal !important;text-transform:none !important}
.act-main{align-items:stretch}
@media (prefers-reduced-motion:reduce){.btn,.crow,.tile{transition:none !important;transform:none !important}}
/*@skin-end*/
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <span class="brand"><img id="logo" alt="" hidden><span class="co" id="co"></span></span>
    <span class="bar-end">
      <span class="pill" id="pill" hidden></span>
      <button class="lang" id="langBtn" type="button">العربية</button>
    </span>
  </header>

  <main>
    <section class="card skel" id="loading" aria-label="Loading"><i></i><i></i><i></i></section>

    <section class="missing" id="missing" hidden>
      <h1 data-i="missingH"></h1>
      <p data-i="missingP"></p>
    </section>

    <div id="view" hidden>
      <article class="card" id="card">
        <svg class="avatar" id="avatar" viewBox="0 0 76 92" aria-hidden="true">
          <defs><clipPath id="arch"><path d="M38 0 C52 8 76 26 76 50 L76 92 L0 92 L0 50 C0 26 24 8 38 0 Z"/></clipPath></defs>
          <path d="M38 0 C52 8 76 26 76 50 L76 92 L0 92 L0 50 C0 26 24 8 38 0 Z" fill="var(--accent)"/>
          <text id="initials" x="38" y="54" text-anchor="middle" dominant-baseline="central"></text>
        </svg>
        <h1 class="name" id="name"></h1>
        <p class="alt" id="alt" lang="ar" hidden></p>
        <p class="role" id="role"></p>
        <p class="org" id="org"></p>
        <button class="btn btn-primary" id="saveBtn" type="button" data-i="save"></button>
      </article>

      <nav class="tiles" id="tiles" aria-label="Contact options"></nav>
      <ul class="rows" id="rows"></ul>

      <section class="share" id="share">
        <h2 id="shareH"></h2>
        <p class="sub" id="shareSub"></p>
        <form id="form" novalidate autocomplete="on">
          <div class="field" id="fName">
            <label for="iName" data-i="fName"></label>
            <input id="iName" name="name" type="text" autocomplete="name" dir="auto" maxlength="100" data-ph="phName">
            <p class="err" hidden></p>
          </div>
          <div class="field" id="fEmail">
            <label for="iEmail" data-i="fEmail"></label>
            <input id="iEmail" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" maxlength="100" data-ph="phEmail">
            <p class="err" hidden></p>
          </div>
          <div class="field" id="fPhone">
            <label for="iPhone" data-i="fPhone"></label>
            <input id="iPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="40" data-ph="phPhone">
          </div>
          <div class="field" id="fCompany">
            <label for="iCompany"><span data-i="fCompany"></span> <small data-i="optional"></small></label>
            <input id="iCompany" name="company" type="text" autocomplete="organization" dir="auto" maxlength="100" data-ph="phCompany">
          </div>
          <div class="field" id="fNote">
            <button class="linkish" id="noteBtn" type="button" data-i="addNote"></button>
            <div id="noteWrap" hidden>
              <label for="iNote"><span data-i="fNote"></span> <small data-i="optional"></small></label>
              <textarea id="iNote" name="note" dir="auto" maxlength="500" data-ph="phNote"></textarea>
            </div>
          </div>
          <div class="hp" aria-hidden="true"><label>Leave empty <input id="iHp" name="site" type="text" tabindex="-1" autocomplete="off"></label></div>
          <div class="field" id="fConsent">
            <label class="consent"><input id="iConsent" name="consent" type="checkbox"><span id="consentText"></span></label>
            <p class="err" hidden></p>
          </div>
          <button class="btn btn-primary" id="sendBtn" type="submit" data-i="send"></button>
          <details class="how">
            <summary data-i="howH"></summary>
            <p id="howP"></p>
          </details>
        </form>
        <div class="thanks" id="thanks" hidden>
          <div class="thanks-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="thanksH"></span></div>
          <p id="thanksP"></p>
          <button class="btn btn-primary" id="saveBtn2" type="button"></button>
        </div>
      </section>

      <p class="trust" id="trust"></p>
    </div>
  </main>
  <p class="foot"><span id="foot"></span></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Settings (edit before publishing) =====
   cardUrl   Power Automate "Get card" flow URL. When set, links like card.html?c=ID load the card from Dataverse (verified).
   leadUrl   Power Automate "Card page lead" flow URL. Where the visitor form is sent. Empty = the form is hidden (demo still shows it).
   privacyUrl  Link to the privacy notice. Empty = a short default text is shown instead.
   allowLinkCards  true = links that carry the card inside the link (#z=, #d=) are shown, marked "not verified". Set false once Dataverse cards are live.

  var ANDROID = /Android/i.test(navigator.userAgent);
  function b64url(str) {
    var bytes = new TextEncoder().encode(str), bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  /* A real .vcf link served by the Get card flow. Phones open it in Contacts (the share sheet and blob downloads do not). */
  function vcardLink() {
    if (!CONFIG.vcardUrl) return '';
    if (state.mode === 'server' && state.cardId) return CONFIG.vcardUrl + '&id=' + encodeURIComponent(state.cardId);
    var c = state.card, o = { f: c.first, l: c.last, t: c.title, o: c.company, m: c.mobile, p: c.office, e: c.email, u: c.web, s: c.address }, p = {};
    Object.keys(o).forEach(function (k) { if (o[k]) p[k] = o[k]; });
    return CONFIG.vcardUrl + '&d=' + b64url(JSON.stringify(p));
  }
  /* ---------- page analytics: counts only ----------
     One small message per view or tap goes to the GCS Track flow (CONFIG.trackUrl): the card id, what happened, a coarse device class, the page language and how the page
     was opened (the ?s= part of the link: q QR code, l shared link, e email signature, n NFC tag; o is the owner previewing and is never counted). The page puts no IP address, browser
     string or visitor identity in the message and nothing identifying is written to Dataverse (the browser adds its usual request headers, which Power Automate keeps in
     its run history for 28 days). Nothing is sent when Do Not Track or Global Privacy Control is on, for demo and link cards, or when no address is set,
     and a failure never shows or changes anything on the page. */
  var QS = new URLSearchParams(location.search), SRC = String(QS.get('s') || QS.get('amp;s') || '').toLowerCase();   // 'amp;s' = the link was copied HTML-escaped
  if (!/^[a-z]$/.test(SRC)) SRC = '';      // only a single letter is a source (o = the owner previewing); anything else, like ?s=outlook, counts as direct
  function deviceClass() { return IOS ? 'ios' : /Android/i.test(navigator.userAgent || '') ? 'android' : 'desktop'; }
  function track(kind) {
    try {
      if (!CONFIG.trackUrl || state.mode !== 'server' || !state.cardId || SRC === 'o') return;
      if (navigator.doNotTrack === '1' || window.doNotTrack === '1' || navigator.msDoNotTrack === '1' || navigator.globalPrivacyControl) return;
      var body = JSON.stringify({ id: state.cardId, kind: kind, device: deviceClass(), lang: state.lang, source: SRC });
      if (typeof fetch === 'function') {   // the same call as Get card (text/plain, so no preflight), but the answer is never read and no cookies go with it
        try { fetch(CONFIG.trackUrl, { method: 'POST', mode: 'no-cors', credentials: 'omit', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: body }).catch(function () {}); return; } catch (e) {}
      }
      if (navigator.sendBeacon) navigator.sendBeacon(CONFIG.trackUrl, body);
    } catch (e) {}
  }
  document.addEventListener('click', function (e) {   // calls, emails and WhatsApp chats started from the card (the buttons and the rows)
    var a = e.target && e.target.closest && e.target.closest('a[href]'); if (!a) return;
    var h = a.getAttribute('href') || '';
    if (/^tel:/i.test(h)) track('call'); else if (/^mailto:/i.test(h)) track('email'); else if (/^https:\/\/wa\.me\//i.test(h)) track('whatsapp');
  });
  function saveContact() {
    track('save');
    var c = state.card, fname = fileName(c), blob = new Blob([vcard(c)], { type: 'text/vcard;charset=utf-8' });
    var link = vcardLink();
    if (link && (IOS || ANDROID)) { location.href = link; showCopyHint(); return; }
    var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
    showCopyHint();
  }
  function showCopyHint() {
    if ($('copyHint')) return;
    var p = document.createElement('p'); p.id = 'copyHint'; p.className = 'sub'; p.style.margin = '10px 2px 0';
    p.appendChild(document.createTextNode(t('saveHelp') + ' '));
    var b = document.createElement('button'); b.type = 'button'; b.className = 'linkish'; b.textContent = t('copyDetails'); b.addEventListener('click', copyDetails);
    p.appendChild(b); $('card').insertAdjacentElement('afterend', p);
  }

  /* ---------- visitor form ---------- */
  function setErr(id, msg) {
    var f = $(id), p = f.querySelector('.err'); f.classList.toggle('bad', !!msg);
    if (p) { p.textContent = msg || ''; p.hidden = !msg; }
  }
  function showThanks(demo) {
    $('form').hidden = true; $('thanks').hidden = false;
    if (demo) toast(t('demoSent'));
    $('thanks').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function onSubmit(ev) {
    ev.preventDefault();
    var f = $('form').elements, name = s(f.name.value, 100), email = s(f.email.value, 100), phone = s(f.phone.value, 40), company = s(f.company.value, 100), note = s(f.note.value, CONFIG.noteMax);
    var bad = false, em = '';
    setErr('fName', name ? '' : t('errName')); bad = bad || !name;
    if (!email && !phone) em = t('errContact'); else if (email && !toMail(email)) em = t('errEmail');
    setErr('fEmail', em); bad = bad || !!em;
    setErr('fConsent', f.consent.checked ? '' : t('errConsent')); bad = bad || !f.consent.checked;
    if (bad) return;
    var botLike = !!f.site.value || (Date.now() - state.loadedAt) < 2500;
    if (botLike) { showThanks(false); return; }
    if (state.mode === 'demo' || !CONFIG.leadUrl) { showThanks(true); return; }
    var btn = $('sendBtn'); btn.disabled = true; btn.textContent = t('sending');
    var payload = {
      v: 3, kind: 'lead', cardId: state.cardId, owner: state.card.email, ownerName: fullName(state.card),
      name: name, email: email, phone: phone, company: company, note: note,
      consent: 'Yes', consentText: t('consent', nameVars()), lang: state.lang, ts: new Date().toISOString(), mode: state.mode
    };
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 15000);
    fetch(CONFIG.leadUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload), signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); showThanks(false); })
      .catch(function () { setErr('fConsent', t('errSend')); })
      .then(function () { clearTimeout(timer); btn.disabled = false; btn.textContent = t('send'); });
  }

  /* ---------- load the card from the link ---------- */
  function b64uToBytes(x) { x = x.replace(/-/g, '+').replace(/_/g, '/'); while (x.length % 4) x += '='; var bin = atob(x), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function inflateRaw(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  }
  function fromHash(h) {
    if (h === 'demo') return Promise.resolve({ card: (CONFIG.quirks && QUIRKS.demo) ? QUIRKS.demo : DEMO, mode: 'demo' });
    var m = /^(z|d)=([A-Za-z0-9_-]+)$/.exec(h);
    if (!m || !CONFIG.allowLinkCards) return Promise.resolve(null);
    var p;
    if (m[1] === 'z') p = window.DecompressionStream ? inflateRaw(b64uToBytes(m[2])) : Promise.resolve(null);
    else p = Promise.resolve(new TextDecoder().decode(b64uToBytes(m[2])));
    return p.then(function (json) { return json ? { card: JSON.parse(json), mode: 'link' } : null; });
  }
  function fromServer(id) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 12000);
    return fetch(CONFIG.cardUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: id }), signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; })
      .then(function (j) { var c = j && (j.card || j); return c && (c.name || c.first || c.f) ? { card: c, mode: 'server' } : null; });
  }
  /* company colours (CONFIG.brand): only plain six-digit hex values are accepted */
  function applyBrand(B) {
    if (!B || typeof B !== 'object') return false;
    var hex = /^#[0-9a-fA-F]{6}$/, root = document.documentElement.style, did = false;
    function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
    function hexOf(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
    function lum(c) { var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; }
    function ratio(a, b) { var l1 = lum(a), l2 = lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }
    function blend(a, b, t) { return a.map(function (v, i) { return v * (1 - t) + b[i] * t; }); }
    function pickInk(bg, light, dark) { return ratio(rgb(light), bg) >= ratio(rgb(dark), bg) ? light : dark; }   // whichever text colour reads better on this background
    if (hex.test(B.card)) {
      var cc = rgb(B.card), ink = pickInk(cc, '#F2F6F4', '#14262B'), muted = blend(rgb(ink), cc, 0.3);
      if (ratio(muted, cc) < 4.5) muted = rgb(ink);
      root.setProperty('--card', B.card); root.setProperty('--card-ink', ink); root.setProperty('--card-muted', hexOf(muted));
      root.setProperty('--icon', ratio(cc, [255, 255, 255]) >= 4.5 ? B.card : '#14262B');   // icons sit on white tiles: a light or mid card colour would nearly vanish
      did = true;
    }
    if (hex.test(B.card2)) { root.setProperty('--card-2', B.card2); did = true; }
    if (hex.test(B.accent)) {
      var c = rgb(B.accent);
      root.setProperty('--accent', B.accent); root.setProperty('--accent-hover', hexOf(c.map(function (v) { return v * 0.88; })));
      root.setProperty('--accent-ink', pickInk(c, '#FFFFFF', '#1B1400')); did = true;
    }
    return did;
  }
  window.__applyBrand = applyBrand;
  window.__demoCard = function () { return (CONFIG.quirks && QUIRKS.demo) ? QUIRKS.demo : DEMO; };   /* used only by automated tests */
  function start() {
    applyBrand(CONFIG.brand);
    var q = new URLSearchParams(location.search), id = q.get('c') || '';
    var want = (q.get('lang') || '').toLowerCase(), saved = '';
    try { saved = localStorage.getItem('gcs_card_lang') || ''; } catch (e) {}
    var pref = want || saved || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
    setLang(pref, false);
    var job;
    if (id && /^[A-Za-z0-9_-]{6,40}$/.test(id) && CONFIG.cardUrl) { state.cardId = id; job = fromServer(id); }
    else job = fromHash(location.hash.replace(/^#/, ''));
    job.then(function (r) { if (r) showCard(r.card, r.mode); else showMissing(); }, showMissing);
  }

  $('langBtn').addEventListener('click', function () { setLang(state.lang === 'en' ? 'ar' : 'en', true); });
  $('saveBtn').addEventListener('click', saveContact);
  $('saveBtn2').addEventListener('click', saveContact);
  $('iNote').maxLength = CONFIG.noteMax;
  $('noteBtn').addEventListener('click', function () { this.hidden = true; $('noteWrap').hidden = false; $('iNote').focus(); });
  $('form').addEventListener('submit', onSubmit);
  /* scanning a second QR in the same tab only changes the part after #, so reload to show the new card */
  window.addEventListener('hashchange', function () { location.reload(); });
  start();
})();
</script>
</body>
</html>
